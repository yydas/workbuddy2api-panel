# 方案 B：跟踪上游 misakano7545/workbuddy2api-panel，有更新才自动构建 Docker 镜像
# 使用方法：放到你 fork 仓库的 .github/workflows/ 目录下，推送到默认分支 main
# 触发方式：每天 03:00 UTC 检查一次上游 + 可在 Actions 页面手动触发
name: track-upstream-and-build

on:
  schedule:
    - cron: '0 3 * * *'   # 每天 03:00（UTC）检查一次上游，可自行调整频率
  workflow_dispatch:       # 支持在 Actions 页面点 Run workflow 手动触发

env:
  UPSTREAM_REPO: misakano7545/workbuddy2api-panel
  UPSTREAM_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # 推送 GHCR 镜像需要

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 拉取上游最新提交
        run: |
          git remote add upstream https://github.com/${UPSTREAM_REPO}.git
          git fetch upstream ${UPSTREAM_BRANCH} --depth=1

      - name: 判断上游是否有新提交
        id: changed
        run: |
          NEW=$(git rev-parse upstream/${UPSTREAM_BRANCH})
          OLD=$(git rev-parse HEAD)
          if [ "$NEW" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游无新提交，跳过构建"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=${NEW}" >> "$GITHUB_OUTPUT"
          fi

      - name: 同步到上游最新代码
        if: steps.changed.outputs.changed == 'true'
        run: git reset --hard upstream/${UPSTREAM_BRANCH}

      - name: 登录 GHCR（GitHub 自带镜像仓库）
        if: steps.changed.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        if: steps.changed.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.changed.outputs.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.changed.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
